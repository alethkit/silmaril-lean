<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silmaril compiler explorer</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <h1>Compiler explorer</h1>
  <div class="pickers">
    <label>Problem <select id="program"></select></label>
    <label>Build <select id="build"></select></label>
    <label>Links <select id="mode">
      <option value="navigation">navigation</option>
      <option value="semantic">semantic</option>
    </select></label>
  </div>
  <p class="note">Precompiled builds only: this page compiles nothing. "proved" and "disproved" come from Lean, for these exact files.</p>
</header>
<main>
  <section class="pane" aria-label="source">
    <div class="pane-head"><h2 id="source-title">Source</h2><label>show <select id="source-show"></select></label><span id="source-links"></span></div>
    <div id="source" class="code"></div>
  </section>
  <section class="pane" aria-label="target">
    <div class="pane-head"><h2 id="target-title">Target</h2><label>show <select id="target-show"></select></label><span id="target-links"></span></div>
    <div id="target" class="code"></div>
  </section>
  <aside id="side">
    <section id="problem"></section>
    <section id="questions"></section>
    <section id="selection"></section>
    <section id="stages"></section>
    <section id="blocks" hidden></section>
    <section id="dwarf"></section>
    <section id="env"></section>
    <section id="provenance"></section>
  </aside>
</main>
<footer id="status" class="muted"></footer>
</body>
</html>
